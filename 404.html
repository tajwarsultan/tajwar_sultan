<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found | Tajwar Sultan</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .error-container {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: var(--bg-color);
      color: var(--text-color);
    }
    .error-code {
      font-size: 8rem;
      font-weight: 900;
      color: var(--primary);
      text-shadow: 0 0 20px var(--primary-glow);
      margin-bottom: 0;
    }
    .error-msg {
      font-size: 1.5rem;
      color: var(--text-muted);
      margin-bottom: 30px;
    }
  </style>
</head>
<body>
  <div class="error-container">
    <h1 class="error-code">404</h1>
    <p class="error-msg">Whoops! This page moved to a parallel universe.</p>
    <a href="index.html" class="btn btn-primary"><span>Back to Reality</span></a>
  </div>
</body>
</html>
